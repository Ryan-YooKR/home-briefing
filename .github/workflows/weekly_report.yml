name: Real Estate Decision Report (Mon, Wed, Fri)

on:
  schedule:
    # 매주 월, 수, 금 오전 08:30 KST (UTC 기준 일, 화, 목 23:30)
    - cron: '30 23 * * 0,2,4'
  workflow_dispatch: # 언제든 수동 즉시 실행 가능

permissions:
  contents: write

jobs:
  run-weekly-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Report, Deploy to Pages & Send KakaoTalk
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python weekly_real_estate_reporter.py
